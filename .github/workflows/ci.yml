name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cancel superseded PR runs only; every master commit gets a full run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history for `changelog` (scripts/git-log.cjs), as in the published build
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: SCSS module typings up to date
        run: npx typed-scss-modules "src/**/*.module.scss" --listDifferent

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      # the GitHub Pages project site lives in /<repo>/; set "/" here once a custom domain is used
      E2E_BASE_PATH: /${{ github.event.repository.name }}/
      # the absolute address of the published build (og:url, og:image, canonical; see webpack.config.js);
      # the custom domain goes here too
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # cookieless analytics (Umami, see webpack.config.js): repository variables (Settings → Secrets and
      # variables → Actions → Variables); without UMAMI_WEBSITE_ID the build has no analytics
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: the published build lists it in `changelog` (scripts/git-log.cjs)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # builds dist-e2e/ with the base path and serves it like Pages does (e2e/server.mjs)
      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # the tested build is the one that is published
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: dist-e2e

  deploy:
    # only a green master is published
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      # a started deployment is finished, the next one waits
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
