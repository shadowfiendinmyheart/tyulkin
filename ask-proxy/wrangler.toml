# The proxy of `ask` (TASK-71), a Cloudflare Worker; setup in README.md, "ask".
# Deploy from the repository root: npx wrangler deploy --config ask-proxy/wrangler.toml
name = "tyulkin-ask"
main = "worker.ts"
compatibility_date = "2026-09-01"

[vars]
# the site that may ask; the custom domain goes here too (comma-separated)
ALLOWED_ORIGINS = "https://shadowfiendinmyheart.github.io"
# answers a day for all visitors together; "0" turns ask off
DAILY_LIMIT = "100"
# answers a day for one IP
IP_DAILY_LIMIT = "20"

# questions per IP: 5 a minute
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# the answers counted per day: `npx wrangler kv namespace create BUDGET`, then its id here
[[kv_namespaces]]
binding = "BUDGET"
id = "<BUDGET namespace id>"
